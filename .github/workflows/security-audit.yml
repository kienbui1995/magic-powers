name: Security Audit

on:
  push:
    branches: [main]
    paths: ['skills/**', 'agents/**', 'integrations/**', 'hooks/**', 'commands/**']
  pull_request:
    paths: ['skills/**', 'agents/**', 'integrations/**', 'hooks/**', 'commands/**']
  schedule:
    - cron: '0 0 * * 1'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run security audit (14 checks)
        run: bash scripts/security-audit.sh
