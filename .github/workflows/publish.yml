name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate integrations
        run: bash scripts/convert.sh all
      - name: Security audit
        run: bash scripts/security-audit.sh
      - name: Quality audit
        run: bash scripts/quality-audit.sh
      - name: Sync audit
        run: bash scripts/sync-audit.sh
      - name: Link audit
        run: bash scripts/link-audit.sh
      - name: Version audit
        run: bash scripts/version-audit.sh

  publish:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
